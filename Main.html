<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>あなたに合ったアニメを探そう</title>
</head>
<body>

  <header>
    <h1>ANIME FIND</h1>
    <nav>
      <a href="#anime-list">作品一覧</a>
      <a href="#genres">ジャンル</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>あなたに合ったアニメを探そう。</h2>
      <p>作品名やジャンルから、次に観たいアニメを見つけよう。</p>
    </section>

    <section aria-label="アニメを探す">
      <label for="search">作品名で検索</label>
      <input id="search" type="search" placeholder="アニメの名前を入力">

      <label for="season">年代・季節</label>
      <select id="season">
        <option>2026年 秋</option>
      </select>

      <button type="button">検索</button>
    </section>

    <section id="genres">
      <h2>ジャンル</h2>
      <button type="button">すべて</button>
      <button type="button">ファンタジー</button>
      <button type="button">恋愛</button>
      <button type="button">アクション</button>
    </section>

    <section id="anime-list">
      <h2>2026年 秋アニメ</h2>

      <article>
        <h3>サンプルアニメ</h3>
        <p>2026年 秋</p>
        <p>ジャンル：ファンタジー、冒険</p>
        <button type="button">配信先を見る</button>
      </article>

    </section>
  </main>

  <footer>
    <p>ANIME FIND</p>
  </footer>

</body>
</html>
