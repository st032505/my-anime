<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>あなたに合ったアニメを探そう</title>

  <style>
    /* 色をまとめておくと、後から変更しやすい */
    :root {
      --background: #101116;
      --card: #191b22;
      --text: #f5f5f7;
      --muted: #a2a5b1;
      --purple: #a88bff;
      --pink: #ff86b6;
    }

    /* ページ全体の基本設定 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: sans-serif;
    }

    /* 内容の横幅をそろえる */
    .container {
      width: min(1100px, 100% - 40px);
      margin-inline: auto;
    }

    /* ヘッダー */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid #ffffff22;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 2px;
    }

    nav {
      display: flex;
      gap: 20px;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
    }

    nav a:hover {
      color: var(--text);
    }

    /* ページのタイトル */
    .hero {
      padding: 60px 0 35px;
    }

    .hero-label {
      color: var(--purple);
      font-size: 13px;
      letter-spacing: 3px;
    }

    .hero h2 {
      margin: 12px 0;
      font-size: clamp(32px, 6vw, 56px);
    }

    .hero h2 span {
      color: var(--pink);
    }

    .hero p {
      color: var(--muted);
      line-height: 1.8;
    }

    /* 検索欄 */
    .search-row {
      display: flex;
      gap: 10px;
      margin-bottom: 28px;
    }

    .search-row input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #383b46;
      border-radius: 10px;
      background: #191b23;
      color: var(--text);
      font-size: 16px;
    }

    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: var(--purple);
      color: #17131f;
      font-weight: bold;
      cursor: pointer;
    }

    /* ジャンルボタン */
    .genres {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 35px;
    }

    .genres button {
      border: 1px solid #383b46;
      background: #191b23;
      color: var(--text);
    }

    .genres button:hover {
      border-color: var(--purple);
    }

    /* 作品カードを画面幅に合わせて並べる */
    .anime-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      padding-bottom: 60px;
    }

    .anime-card {
      overflow: hidden;
      border: 1px solid #ffffff18;
      border-radius: 14px;
      background: var(--card);
      transition: transform 0.2s, border-color 0.2s;
    }

    .anime-card:hover {
      transform: translateY(-4px);
      border-color: var(--purple);
    }

    /* ポスター代わりの色付きエリア */
    .poster {
      display: grid;
      min-height: 150px;
      place-items: center;
      background: linear-gradient(135deg, #4d467b, #a26484);
      font-size: 48px;
    }

    .anime-card:nth-child(2) .poster {
      background: linear-gradient(135deg, #376c78, #8cc7ad);
    }

    .anime-card:nth-child(3) .poster {
      background: linear-gradient(135deg, #8b4c55, #dc9a68);
    }

    .card-info {
      padding: 16px;
    }

    .card-info h3 {
      margin: 0 0 10px;
      font-size: 17px;
    }

    .card-info p {
      margin: 6px 0;
      color: var(--muted);
      font-size: 13px;
    }

    /* ページ下部 */
    footer {
      padding: 24px 0;
      border-top: 1px solid #ffffff22;
      color: var(--muted);
      font-size: 13px;
    }

    /* スマートフォン向けの調整 */
    @media (max-width: 600px) {
      .container {
        width: min(100% - 28px, 1100px);
      }

      header {
        align-items: flex-start;
        gap: 12px;
      }

      nav {
        gap: 12px;
        font-size: 13px;
      }

      .hero {
        padding-top: 40px;
      }

      .search-row {
        flex-direction: column;
      }

      .search-row button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <header class="container">
    <h1>ANIME FIND</h1>
    <nav>
      <a href="#anime-list">作品一覧</a>
      <a href="#genres">ジャンル</a>
    </nav>
  </header>

  <main class="container">
    <section class="hero">
      <div class="hero-label">YOUR NEXT FAVORITE</div>
      <h2>あなたに合った<br><span>アニメを探そう。</span></h2>
      <p>作品名やジャンルから、次に観たいアニメを見つけよう。</p>
    </section>

    <section class="search-row" aria-label="アニメ検索">
      <input type="search" placeholder="作品名で検索">
      <button type="button">検索</button>
    </section>

    <section id="genres">
      <h2>ジャンルから探す</h2>
      <div class="genres">
        <button type="button">すべて</button>
        <button type="button">ファンタジー</button>
        <button type="button">恋愛</button>
        <button type="button">アクション</button>
      </div>
    </section>

    <section id="anime-list">
      <h2>2026年 秋アニメ</h2>

      <div class="anime-list">
        <article class="anime-card">
          <div class="poster">✨</div>
          <div class="card-info">
            <h3>サンプルアニメ A</h3>
            <p>ジャンル：ファンタジー、冒険</p>
            <p>2026年 秋</p>
          </div>
        </article>

        <article class="anime-card">
          <div class="poster">🌿</div>
          <div class="card-info">
            <h3>サンプルアニメ B</h3>
            <p>ジャンル：日常、コメディ</p>
            <p>2026年 秋</p>
          </div>
        </article>

        <article class="anime-card">
          <div class="poster">🔥</div>
          <div class="card-info">
            <h3>サンプルアニメ C</h3>
            <p>ジャンル：アクション</p>
            <p>2026年 秋</p>
          </div>
        </article>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">ANIME FIND</div>
  </footer>

</body>
</html>
